<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario</title>
</head>
<body>
  <h1>Registro de usuarios</h1>
  <form action="#" method="POST">
    <fieldset>
      <legend>Datos Personales</legend>
      <label for="nombre">Nombre y Apellidos:</label>
      <input type="text" id="nombre" name="nombre"  placeholder="Adrian Alberca Álvarez" required>
      <br>
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="nombre@gmail.com" required>
      <br>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8">
      <br>
      <label for="nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="nacimiento" name="nacimiento">
      <br>
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" placeholder="Entre 16 y 99" min="16" max="99">
    </fieldset>

    <fieldset>
      <legend>Datos Académicos y Preferencias</legend>
      <p>Turno:</p>
      <input type="radio" id="manana" name="turno" value="manana">
      <label for="manana">Mañana</label>
      <input type="radio" id="tarde" name="turno" value="tarde">
      <label for="tarde">Tarde</label>
      <p>Módulos matriculados:</p>
      <input type="checkbox" id="lm" name="modulos" value="lenguajes-marcas">
      <label for="lenguaje de marcas">Lenguajes de Marcas</label>
      <input type="checkbox" id="prog" name="modulos" value="programacion">
      <label for="programacion">Programación</label>
      <input type="checkbox" id="bd" name="modulos" value="bases-datos">
      <label for="base de datos">Bases de Datos</label><br>
      <label for="nivel">Nivel de experiencia:</label> <select id="nivel" name="nivel">
        <option value="sin">Sin experiencia</option>
        <option value="basico">Básico</option>
        <option value="intermedio">Intermedio</option>
        <option value="avanzado">Avanzado</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Observaciones y Botones</legend>
      <label for="comentarios">Comentarios / Biografía:</label>
      <br>
      <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Cuéntanos algo sobre ti..."></textarea>
      <br>
      <input type="checkbox" id="terminos" name="terminos" required>
      <label for="terminos">Acepto la política de privacidad</label>
      <br><br>
      <button type="submit">Enviar</button>
      <button type="reset">Restablecer</button>
    </fieldset>

  </form>
</body>
</html>
